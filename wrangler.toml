# Cloudflare Pages 배포 설정 (config-as-code)
# 이 파일이 있으면 Cloudflare Pages 가 빌드 출력 경로와 호환성 플래그를 자동 적용합니다.
name = "blog-jindonusu"
compatibility_date = "2025-06-01"
# Nuxt/Nitro 워커가 일부 Node API 를 사용하므로 nodejs_compat 필요
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# ── 견적 신청 저장용 KV (관리자 조회 페이지 /quotes) ──────────────
# 네임스페이스: jindonusu-quotes
[[kv_namespaces]]
binding = "QUOTES"
id = "d7461f9665aa4a11b402a4b93202781e"
